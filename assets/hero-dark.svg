<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="55%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a371f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(88,166,255,0.06)" stroke-width="1"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="1" y="1" width="858" height="218" rx="15"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(16deg); }
      30% { transform: rotate(-10deg); }
      45% { transform: rotate(12deg); }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(18px, -10px); }
    }
    .wave { display: inline-block; transform-origin: 14px -8px; animation: wave 2.8s ease-in-out infinite; }
    .cursor { animation: blink 1.1s infinite; }
    .dot-live { transform-origin: 734px 20px; animation: pulseDot 2.2s ease-in-out infinite; }
    .orb-a { animation: drift 8s ease-in-out infinite; }
  </style>

  <g clip-path="url(#outerClip)">
    <rect x="1" y="1" width="858" height="218" rx="15" fill="#0d1117"/>
    <rect x="1" y="38" width="858" height="181" fill="url(#grid)"/>
    <circle class="orb-a" cx="190" cy="120" r="170" fill="url(#glow1)"/>
    <circle cx="700" cy="145" r="160" fill="url(#glow2)"/>

    <!-- Window Top Bar -->
    <rect x="1" y="1" width="858" height="37" fill="#161b22"/>
    <line x1="1" y1="38" x2="859" y2="38" stroke="#30363d" stroke-width="1"/>
    <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="5.5" fill="#ffbd2e"/>
    <circle cx="58" cy="20" r="5.5" fill="#27c93f"/>
    <text x="430" y="24" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">misoryan@easecation: ~/profile</text>
    <circle class="dot-live" cx="734" cy="20" r="4.2" fill="#3fb950"/>
    <text x="745" y="24" class="mono" font-size="11.5" fill="#8b949e">Shenzhen, CN</text>
    <rect x="80" y="1" width="700" height="2" fill="url(#topLine)"/>

    <!-- Left Hero Content -->
    <text x="36" y="88" class="sans" font-size="30" font-weight="700" fill="url(#titleGrad)">Hi, I&apos;m Misoryan</text>
    <g transform="translate(264, 87)"><text x="0" y="0" class="sans wave" font-size="26">👋</text></g>

    <text x="36" y="122" class="sans" font-size="15.5" fill="#8b949e">
      服务端架构与全栈工程师 · Building Distributed Systems at
      <tspan fill="#58a6ff" font-weight="600">@EaseCation</tspan>
    </text>

    <text x="36" y="160" class="mono" font-size="13" fill="#3fb950">➜</text>
    <text x="54" y="160" class="mono" font-size="13" fill="#a371f7">~</text>
    <text x="68" y="160" class="mono" font-size="13" fill="#8b949e">$ echo $CORE_STACK</text>

    <text x="36" y="188" class="mono" font-size="13.5" font-weight="600" fill="#58a6ff">
      &gt; JVM Server Engines · Network Protocols · Cross-Platform Runtime · TypeScript Full-Stack
      <tspan class="cursor" fill="#3fb950">▋</tspan>
    </text>

    <!-- Right Highlight Stat Card -->
    <rect x="642" y="58" width="184" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="660" y="84" class="mono" font-size="11" fill="#8b949e">PAST YEAR ACTIVITY</text>
    <text x="660" y="116" class="mono" font-size="25" font-weight="700" fill="#3fb950">2,720+</text>
    <text x="660" y="136" class="sans" font-size="12" fill="#8b949e">GitHub Contributions &amp; PRs</text>
  </g>
  <rect x="1" y="1" width="858" height="218" rx="15" fill="none" stroke="#30363d" stroke-width="1.2"/>
</svg>